<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>資格勉強パズル</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>資格勉強パズル</h1>
      <nav class="tabs" id="tabs" role="tablist" aria-label="モード">
        <button type="button" role="tab" data-view="match">用語あてはめ <span class="count" id="count-match"></span></button>
        <button type="button" role="tab" data-view="choice">4択クイズ <span class="count" id="count-choice"></span></button>
        <button type="button" role="tab" data-view="kamokuB">科目B <span class="count" id="count-kamokuB"></span></button>
      </nav>
    </header>

    <details class="filter" id="filter">
      <summary id="filter-summary">ジャンル：すべて</summary>
      <div class="filter-body" id="filter-body"></div>
    </details>

    <!-- ===== 用語あてはめ ===== -->
    <section class="view" id="view-match" role="tabpanel">
      <div class="view-head">
        <p class="stats" id="m-stats"></p>
        <p class="progress" id="m-progress"></p>
      </div>

      <!-- 設定画面 -->
      <section class="setup" id="m-setup">
        <p class="setup-title">今日は何問やる？</p>
        <div class="counter">
          <button type="button" id="m-minus" aria-label="5問へらす">−5</button>
          <output id="m-count" aria-live="polite"></output>
          <button type="button" id="m-plus" aria-label="5問ふやす">＋5</button>
        </div>
        <p class="setup-info" id="m-setup-info"></p>
        <label class="switch" id="m-calc-row" hidden>
          <input type="checkbox" id="m-calc">
          <span class="switch-track" aria-hidden="true"></span>
          <span>5問に1回、計算問題を入れる</span>
        </label>
        <button type="button" class="primary" id="m-start">はじめる</button>
      </section>

      <!-- 問題を解く画面 -->
      <div class="play" id="m-play" hidden>
        <section class="question">
          <div class="question-head">
            <p class="tag" id="m-tag"><span id="m-tag-text"></span> <span class="calc-badge" id="m-calc-badge" hidden>計算</span></p>
            <p class="record" id="m-record"></p>
          </div>
          <p class="stem" id="m-stem"></p>
          <div class="extras" id="m-extras"></div>
          <p class="hint" id="m-hint">選択肢をタップしてから、正しい説明をタップしよう</p>
        </section>

        <div class="board" id="m-board">
          <svg class="lines" id="m-lines" aria-hidden="true"></svg>
          <div class="column">
            <h2>選択肢</h2>
            <ul class="cards" id="m-terms"></ul>
          </div>
          <div class="column">
            <h2>説明</h2>
            <ul class="cards" id="m-meanings"></ul>
          </div>
        </div>

        <!-- 計算問題のときだけ使う4択 -->
        <ol class="choices" id="m-choices" hidden></ol>

        <section class="result" id="m-result" hidden></section>
        <footer class="actions">
          <button type="button" id="m-check" disabled>答え合わせ</button>
          <button type="button" id="m-next" hidden>次の問題</button>
        </footer>
        <p class="source" id="m-source"></p>
      </div>

      <!-- 結果画面 -->
      <section class="summary" id="m-summary" hidden>
        <div id="m-summary-body"></div>
        <div class="summary-actions">
          <button type="button" class="primary" id="m-again">同じ問題数でもう一度</button>
          <button type="button" id="m-back">問題数を選び直す</button>
        </div>
      </section>
    </section>

    <!-- ===== 4択クイズ ===== -->
    <section class="view" id="view-choice" role="tabpanel" hidden>
      <div class="view-head">
        <p class="stats" id="c-stats"></p>
        <p class="progress" id="c-progress"></p>
      </div>

      <!-- 設定画面 -->
      <section class="setup" id="c-setup">
        <p class="setup-title">今日は何問やる？</p>
        <div class="counter">
          <button type="button" id="c-minus" aria-label="5問へらす">−5</button>
          <output id="c-count" aria-live="polite"></output>
          <button type="button" id="c-plus" aria-label="5問ふやす">＋5</button>
        </div>
        <p class="setup-info" id="c-setup-info"></p>
        <label class="switch" id="c-calc-row" hidden>
          <input type="checkbox" id="c-calc">
          <span class="switch-track" aria-hidden="true"></span>
          <span>5問に1回、計算問題を入れる</span>
        </label>
        <button type="button" class="primary" id="c-start">はじめる</button>
      </section>

      <!-- 問題を解く画面 -->
      <div class="play" id="c-play" hidden>
        <section class="question">
          <div class="question-head">
            <p class="tag" id="c-tag"><span id="c-tag-text"></span> <span class="calc-badge" id="c-calc-badge" hidden>計算</span></p>
            <p class="record" id="c-record"></p>
          </div>
          <p class="stem" id="c-stem"></p>
          <div class="extras" id="c-extras"></div>
        </section>

        <ol class="choices" id="c-choices"></ol>

        <section class="result" id="c-result" hidden></section>
        <footer class="actions">
          <button type="button" id="c-next" hidden>次の問題</button>
        </footer>
        <p class="source" id="c-source"></p>
      </div>

      <!-- 結果画面 -->
      <section class="summary" id="c-summary" hidden>
        <div id="c-summary-body"></div>
        <div class="summary-actions">
          <button type="button" class="primary" id="c-again">同じ問題数でもう一度</button>
          <button type="button" id="c-back">問題数を選び直す</button>
        </div>
      </section>
    </section>

    <!-- ===== 科目B ===== -->
    <section class="view" id="view-kamokuB" role="tabpanel" hidden>
      <div class="view-head">
        <p class="stats" id="b-stats"></p>
        <p class="progress" id="b-progress"></p>
      </div>

      <!-- 設定画面 -->
      <section class="setup" id="b-setup">
        <p class="setup-title">今日は何問やる？</p>
        <div class="counter">
          <button type="button" id="b-minus" aria-label="1問へらす">−1</button>
          <output id="b-count" aria-live="polite"></output>
          <button type="button" id="b-plus" aria-label="1問ふやす">＋1</button>
        </div>
        <p class="setup-info" id="b-setup-info"></p>
        <p class="setup-sub">1問あたりの目安時間</p>
        <div class="chips timer-choices" id="b-timer-choices"></div>
        <label class="switch" id="b-calc-row" hidden>
          <input type="checkbox" id="b-calc">
          <span class="switch-track" aria-hidden="true"></span>
          <span>5問に1回、計算問題を入れる</span>
        </label>
        <button type="button" class="primary" id="b-start">はじめる</button>
      </section>

      <!-- 問題を解く画面 -->
      <div class="play" id="b-play" hidden>
        <div class="timer" id="b-timer" role="timer" aria-live="off"></div>
        <section class="question">
          <div class="question-head">
            <p class="tag" id="b-tag"></p>
            <p class="record" id="b-record"></p>
          </div>
          <p class="b-title" id="b-title"></p>
          <p class="stem" id="b-stem"></p>
          <div class="extras" id="b-extras"></div>
          <div class="code-viewer" id="b-code" hidden></div>
        </section>

        <section class="trace" id="b-trace-box" hidden>
          <h3 class="trace-title">トレース表</h3>
          <p class="trace-hint">変数をタップ → 列が増える ／ 行番号をタップ → 「いまここ」の印</p>
          <div id="b-trace"></div>
        </section>

        <ol class="choices" id="b-choices"></ol>

        <details class="memo-box">
          <summary>メモ欄（変数の値を追いかけるのに使ってね）</summary>
          <textarea id="b-memo" rows="6" placeholder="例）i=1: x=3, y=5 → i=2: ..."></textarea>
        </details>

        <section class="result" id="b-result" hidden></section>
        <footer class="actions">
          <button type="button" id="b-next" hidden>次の問題</button>
        </footer>
        <p class="source" id="b-source"></p>
      </div>

      <!-- 結果画面 -->
      <section class="summary" id="b-summary" hidden>
        <div id="b-summary-body"></div>
        <div class="summary-actions">
          <button type="button" class="primary" id="b-again">同じ問題数でもう一度</button>
          <button type="button" id="b-back">問題数を選び直す</button>
        </div>
      </section>
    </section>
  </main>

  <!-- 問題データ(年度ごとのファイル) -->
  <script src="data/fe-r05.js"></script>
  <script src="data/fe-r06.js"></script>
  <script src="data/fe-r07.js"></script>
  <script src="data/fe-r08.js"></script>
  <script src="data/fe-r01a.js"></script>
  <script src="data/fe-h31s.js"></script>
  <script src="data/fe-b.js"></script>
  <!-- プログラム -->
  <script src="js/common.js"></script>
  <script src="js/records.js"></script>
  <script src="js/filter.js"></script>
  <script src="js/session.js"></script>
  <script src="js/match.js"></script>
  <script src="js/choice.js"></script>
  <script src="js/trace.js"></script>
  <script src="js/kamokuB.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
